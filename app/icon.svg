<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Night-sky shield base (#0b1030 from TitleScene) -->
  <rect x="2" y="1" width="12" height="14" fill="#0b1030" />
  <rect x="1" y="2" width="14" height="12" fill="#0b1030" />

  <!-- Gold pixel frame (#fbbf24 top/left light, #d97706 bottom/right shade) -->
  <rect x="2" y="0" width="12" height="1" fill="#fbbf24" />
  <rect x="1" y="1" width="1" height="1" fill="#fbbf24" />
  <rect x="14" y="1" width="1" height="1" fill="#fbbf24" />
  <rect x="0" y="2" width="1" height="12" fill="#fbbf24" />
  <rect x="15" y="2" width="1" height="3" fill="#fbbf24" />
  <rect x="15" y="5" width="1" height="9" fill="#d97706" />
  <rect x="1" y="14" width="1" height="1" fill="#d97706" />
  <rect x="14" y="14" width="1" height="1" fill="#d97706" />
  <rect x="2" y="15" width="12" height="1" fill="#d97706" />

  <!-- Stepped Marian blue halo (#1e3a8a navy & #2563eb Marian blue) -->
  <rect x="5" y="3" width="6" height="9" fill="#1e3a8a" />
  <rect x="4" y="4" width="8" height="4" fill="#1e3a8a" />
  <rect x="3" y="5" width="10" height="2" fill="#1e3a8a" />
  <rect x="6" y="12" width="4" height="1" fill="#1e3a8a" />
  <rect x="5" y="4" width="6" height="4" fill="#2563eb" />
  <rect x="6" y="8" width="4" height="2" fill="#2563eb" />

  <!-- Rosary bead ring (#fef08a lit top beads & #fbbf24 lower beads) -->
  <rect x="5" y="2" width="1" height="1" fill="#fef08a" />
  <rect x="10" y="2" width="1" height="1" fill="#fef08a" />
  <rect x="3" y="4" width="1" height="1" fill="#fef08a" />
  <rect x="12" y="4" width="1" height="1" fill="#fef08a" />
  <rect x="3" y="7" width="1" height="1" fill="#fef08a" />
  <rect x="12" y="7" width="1" height="1" fill="#fef08a" />
  <rect x="3" y="9" width="1" height="1" fill="#fbbf24" />
  <rect x="12" y="9" width="1" height="1" fill="#fbbf24" />
  <rect x="4" y="11" width="1" height="1" fill="#fbbf24" />
  <rect x="11" y="11" width="1" height="1" fill="#fbbf24" />

  <!-- Radiant Golden Cross (#f8fafc, #fef08a, #fbbf24, #d97706) -->
  <rect x="7" y="3" width="2" height="10" fill="#fbbf24" />
  <rect x="4" y="5" width="8" height="2" fill="#fbbf24" />
  <rect x="7" y="3" width="1" height="1" fill="#fef08a" />
  <rect x="4" y="5" width="1" height="1" fill="#fef08a" />
  <rect x="11" y="5" width="1" height="1" fill="#fef08a" />
  <rect x="7" y="4" width="1" height="2" fill="#f8fafc" />
  <rect x="4" y="6" width="2" height="1" fill="#d97706" />
  <rect x="10" y="6" width="2" height="1" fill="#d97706" />
  <rect x="8" y="7" width="1" height="5" fill="#d97706" />
  <rect x="7" y="12" width="2" height="1" fill="#d97706" />
  <rect x="6" y="13" width="4" height="1" fill="#d97706" />
</svg>
